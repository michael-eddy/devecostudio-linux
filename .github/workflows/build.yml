name: Build DevEco Studio PKGBUILD

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: Target architecture (aarch64 builds on the ARM runner and produces no Arch package)
        type: choice
        required: true
        default: x86_64
        options:
          - x86_64
          - aarch64
      mac_zip_url:
        description: URL to the Mac zip (devecostudio-mac-<ver>.zip, x64 or ARM)
        required: true
      cli_zip_url:
        description: URL to the commandline-tools-linux-(x64|arm64)-<ver>.zip matching target_arch
        required: true
      pkgver:
        description: 'Override pkgver (e.g. 6.1.1.280). Leave empty to use the value in PKGBUILD.'
        required: false
        default: ''
      mac_zip_sha256:
        description: 'SHA256 of the Mac zip. Leave empty to skip verification (PKGBUILD default: SKIP).'
        required: false
        default: ''
      cli_zip_sha256:
        description: 'SHA256 of the commandline-tools zip. Leave empty to skip verification (PKGBUILD default: SKIP).'
        required: false
        default: ''
      make_arch:
        description: 'Build the Arch package (.pkg.tar.zst)'
        type: boolean
        default: true
      make_deb:
        description: 'Build the .deb'
        type: boolean
        default: true
      make_rpm:
        description: 'Build the .rpm (slowest)'
        type: boolean
        default: true
      make_tarball:
        description: 'Build the distro-agnostic tarball'
        type: boolean
        default: true

jobs:
  build:
    # aarch64 runs on GitHub's ARM runner: nothing here is cross-built (the
    # JBR, launcher, node, Emulator and SDK toolchains are target-arch
    # binaries), and makepkg is not needed — build.sh runs the PKGBUILD.
    runs-on: ${{ inputs.target_arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    # No `container:` block for the x86_64 job: the non-privileged container
    # cannot swapon (rpm packaging peaks at ~16 GB RSS), and the runner's own
    # swap is only 3 GB. Instead run on the host, add swap with sudo, and do
    # the actual build inside `docker run archlinux:base-devel` — the
    # container inherits the host's memory + swap. The swapfile helps the
    # aarch64 job for the same reason (nfpm runs on the host there).

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: devecostudio

      - name: Add swap on the host (rpm packaging needs ~16 GB RSS)
        if: inputs.make_rpm
        run: |
          # host job: the runner user has passwordless sudo; a real swapfile
          # on the host is inherited by the build container below.
          sudo rm -f /ci.swap
          sudo fallocate -l 14G /ci.swap
          sudo chmod 600 /ci.swap
          sudo mkswap /ci.swap >/dev/null
          sudo swapon /ci.swap
          free -h

      - name: Apply version and checksum overrides
        working-directory: devecostudio
        run: |
          if [[ -n "${{ inputs.pkgver }}" ]]; then
            sed -i "s/^pkgver=.*/pkgver=${{ inputs.pkgver }}/" PKGBUILD
            echo "pkgver overridden to ${{ inputs.pkgver }}"
          fi
          # The PKGBUILD defaults the two user-supplied zip checksums to
          # SKIP; MAC_ZIP_SHA256 / CLI_ZIP_SHA256 pin them when supplied.
          # Passing them as environment variables means makepkg, build.sh
          # and the container below all see them. No line-number editing.
          if [[ -n "${{ inputs.mac_zip_sha256 }}" ]]; then
            echo "MAC_ZIP_SHA256=${{ inputs.mac_zip_sha256 }}" >> "$GITHUB_ENV"
            echo "mac zip sha256 pinned"
          fi
          if [[ -n "${{ inputs.cli_zip_sha256 }}" ]]; then
            echo "CLI_ZIP_SHA256=${{ inputs.cli_zip_sha256 }}" >> "$GITHUB_ENV"
            echo "cli zip sha256 pinned"
          fi

      - name: Download source archives
        working-directory: devecostudio
        run: |
          # Huawei's filename stem for the chosen architecture; everything
          # else arch-specific (URLs, checksums, native lib directories, the
          # deb/rpm arch spellings) comes from the PKGBUILD's CARCH case block.
          if [[ "${{ inputs.target_arch }}" == 'aarch64' ]]; then
            cli_arch=arm64
          else
            cli_arch=x64
          fi

          curl -fL \
            -o devecostudio-mac.zip \
            "${{ inputs.mac_zip_url }}" &

          curl -fL \
            -o "commandline-tools-linux-${cli_arch}.zip" \
            "${{ inputs.cli_zip_url }}" &

          wait

      - name: Build and package inside archlinux container (x86_64)
        if: inputs.target_arch == 'x86_64'
        env:
          MAKE_ARCH: ${{ inputs.make_arch }}
          MAKE_DEB: ${{ inputs.make_deb }}
          MAKE_RPM: ${{ inputs.make_rpm }}
          MAKE_TARBALL: ${{ inputs.make_tarball }}
        run: |
          # Everything in this step runs as root inside the container; the
          # container inherits the host's memory + swap (added above).
          docker run --rm -e MAKE_ARCH -e MAKE_DEB -e MAKE_RPM -e MAKE_TARBALL \
            -e MAC_ZIP_SHA256 -e CLI_ZIP_SHA256 \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            archlinux:base-devel bash -c '
            set -eo pipefail
            echo "=== free -h (inside container) ==="
            free -h
            pacman -Syu --noconfirm
            pacman -S --needed --noconfirm git jq p7zip sudo
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
            chown -R builder:builder /work
            if [[ $MAKE_DEB == true || $MAKE_RPM == true ]]; then
              # nfpm is not in the Arch repos; fetch the static binary from
              # the GitHub release (pinned version; update deliberately).
              # Fetched *before* makepkg and into a file rather than piped into
              # tar: a release-asset 504 is transient, but after the 20-minute
              # build it discarded everything for nothing — here it fails within
              # seconds. A pipe also hid the curl error inside the empty-input
              # gzip error of the downstream tar (run 42470688729).
              curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
                --connect-timeout 15 \
                -o /tmp/nfpm.tar.gz \
                https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
              tar xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
              nfpm --version | grep GitVersion
            fi
            # A run that skips the Arch package only needs the staging tree
            # the other formats are made from, so --noarchive saves the zstd
            # step. No -c either way: --clean removes pkg/.
            makepkg_args=(-sf --noconfirm)
            [[ $MAKE_ARCH == true ]] || makepkg_args+=(--noarchive)
            runuser -u builder -- bash -c "
              cd /work/devecostudio
              makepkg ${makepkg_args[*]}
            "
            cd /work/devecostudio
            if [[ -d pkg/devecostudio ]]; then
              # --stage packages the existing makepkg tree; --deb/--rpm add
              # the nfpm packages and --no-tarball drops the gzip step.
              pkg_args=(--stage=pkg/devecostudio)
              if [[ $MAKE_DEB == true ]]; then pkg_args+=(--deb); fi
              if [[ $MAKE_RPM == true ]]; then pkg_args+=(--rpm); fi
              if [[ $MAKE_TARBALL != true ]]; then pkg_args+=(--no-tarball); fi
              ./build.sh "${pkg_args[@]}"
            else
              echo "pkg/devecostudio not found; skipping packages"
            fi
          '

      - name: Install build dependencies (aarch64)
        if: inputs.target_arch == 'aarch64'
        run: |
          # Same tool set the Arch container provides: jq, a system python3
          # (the PKGBUILD's exec-bit scan and the patchers), 7z for the DMG,
          # bsdtar/unzip for the SDK zips (7z drops its symlink chains),
          # strip, and envsubst for nfpm.yaml.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq python3 p7zip-full libarchive-tools unzip binutils gettext-base patchelf

      - name: Build and package with build.sh (aarch64)
        if: inputs.target_arch == 'aarch64'
        env:
          MAKE_DEB: ${{ inputs.make_deb }}
          MAKE_RPM: ${{ inputs.make_rpm }}
          MAKE_TARBALL: ${{ inputs.make_tarball }}
        run: |
          cd devecostudio
          args=(--arch=aarch64)
          if [[ $MAKE_DEB == true || $MAKE_RPM == true ]]; then
            # nfpm is not packaged for Ubuntu either; static binary, pinned.
            # Into a file, not piped into tar, and with retries: a release-asset
            # 504 should be visible as a curl error instead of tar's
            # "unexpected end of file" (see the x86_64 step above).
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 15 \
              -o /tmp/nfpm.tar.gz \
              https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_arm64.tar.gz
            tar xzf /tmp/nfpm.tar.gz -C /tmp nfpm
            sudo mv /tmp/nfpm /usr/local/bin/nfpm
            nfpm --version | grep GitVersion
            if [[ $MAKE_DEB == true ]]; then args+=(--deb); fi
            if [[ $MAKE_RPM == true ]]; then args+=(--rpm); fi
          fi
          if [[ $MAKE_TARBALL != true ]]; then args+=(--no-tarball); fi
          # No makepkg here: build.sh runs the PKGBUILD's prepare()/package()
          # itself and then emits the selected formats.
          ./build.sh "${args[@]}"

      - name: Upload Arch package
        if: inputs.make_arch && inputs.target_arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-arch-${{ inputs.target_arch }}
          path: devecostudio/*.pkg.tar.zst
          if-no-files-found: warn

      - name: Upload Debian package
        if: inputs.make_deb
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-deb-${{ inputs.target_arch }}
          path: devecostudio/devecostudio_*.deb
          if-no-files-found: warn

      - name: Upload RPM package
        if: inputs.make_rpm
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-rpm-${{ inputs.target_arch }}
          path: devecostudio/devecostudio-*.rpm
          if-no-files-found: warn

      - name: Upload tarball
        if: inputs.make_tarball
        uses: actions/upload-artifact@v4
        with:
          name: devecostudio-tarball-${{ inputs.target_arch }}
          path: devecostudio/devecostudio-*.tar.gz
          if-no-files-found: warn
